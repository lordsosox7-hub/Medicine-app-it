kind = "web"
previewPath = "/doctor-admin-app/"
title = "Doctor Admin Portal"
version = "1.0.0"
id = "artifacts/doctor-admin-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/doctor-admin-app/" ]
localPort = 25495

[services.development]
run = "pnpm --filter @workspace/doctor-admin-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/doctor-admin-app", "run", "build" ]
publicDir = "artifacts/doctor-admin-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25495"
BASE_PATH = "/doctor-admin-app/"
